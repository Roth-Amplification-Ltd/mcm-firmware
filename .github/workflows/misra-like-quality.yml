name: Deterministic firmware quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MPL source headers
        run: python3 tools/check_license_headers.py
      - name: Verify MCM MISRA-like profile
        run: python3 tools/check_misra_like.py
      - name: Run host protocol tests
        run: bash tests/host/run.sh
