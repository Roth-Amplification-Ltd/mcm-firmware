name: License headers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mpl-headers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify MPL-2.0 source headers
        run: python3 tools/check_license_headers.py
