<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <style>
    .title { font: 700 34px sans-serif; fill: #17172a; }
    .subtitle { font: 700 23px sans-serif; fill: #17172a; }
    .label { font: 700 17px sans-serif; fill: #17172a; }
    .small { font: 15px sans-serif; fill: #33334a; }
    .byte { stroke: #2d2940; stroke-width: 2; }
    .arrow { stroke: #5a526f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a526f"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#faf9fc"/>
  <text x="700" y="55" text-anchor="middle" class="title">MCM SPI Snapshot Protocol</text>
  <text x="80" y="112" class="subtitle">Common 8-byte packet</text>

  <g transform="translate(80,140)">
    <rect class="byte" x="0" y="0" width="145" height="100" fill="#e9ddff"/>
    <rect class="byte" x="145" y="0" width="145" height="100" fill="#e6ebff"/>
    <rect class="byte" x="290" y="0" width="145" height="100" fill="#dff6ee"/>
    <rect class="byte" x="435" y="0" width="145" height="100" fill="#fff0d5"/>
    <rect class="byte" x="580" y="0" width="145" height="100" fill="#ffe5ea"/>
    <rect class="byte" x="725" y="0" width="145" height="100" fill="#ffe5ea"/>
    <rect class="byte" x="870" y="0" width="145" height="100" fill="#ffe5ea"/>
    <rect class="byte" x="1015" y="0" width="145" height="100" fill="#e7e7ea"/>
    <g text-anchor="middle">
      <text x="72" y="30" class="small">Byte 0</text><text x="72" y="65" class="label">SYNC</text><text x="72" y="87" class="small">A5</text>
      <text x="217" y="30" class="small">Byte 1</text><text x="217" y="65" class="label">VERSION</text><text x="217" y="87" class="small">01</text>
      <text x="362" y="30" class="small">Byte 2</text><text x="362" y="65" class="label">TYPE</text>
      <text x="507" y="30" class="small">Byte 3</text><text x="507" y="65" class="label">INDEX</text>
      <text x="652" y="30" class="small">Byte 4</text><text x="652" y="65" class="label">DATA0</text>
      <text x="797" y="30" class="small">Byte 5</text><text x="797" y="65" class="label">DATA1</text>
      <text x="942" y="30" class="small">Byte 6</text><text x="942" y="65" class="label">DATA2</text>
      <text x="1087" y="30" class="small">Byte 7</text><text x="1087" y="65" class="label">CRC-8</text><text x="1087" y="87" class="small">bytes 0–6</text>
    </g>
  </g>

  <text x="80" y="315" class="subtitle">GET_SNAPSHOT transaction</text>
  <g transform="translate(80,350)">
    <rect x="0" y="0" width="180" height="74" rx="10" fill="#e9ddff" stroke="#2d2940" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="label">Master command</text>
    <text x="90" y="55" text-anchor="middle" class="small">81 / GET_SNAPSHOT</text>

    <path class="arrow" d="M190 37 H285"/>
    <rect x="300" y="0" width="190" height="74" rx="10" fill="#fff0d5" stroke="#2d2940" stroke-width="2"/>
    <text x="395" y="30" text-anchor="middle" class="label">MCM captures</text>
    <text x="395" y="55" text-anchor="middle" class="small">6 encoders + 6 buttons</text>

    <path class="arrow" d="M500 37 H595"/>
    <rect x="610" y="0" width="180" height="74" rx="10" fill="#dff6ee" stroke="#2d2940" stroke-width="2"/>
    <text x="700" y="30" text-anchor="middle" class="label">IRQ HIGH</text>
    <text x="700" y="55" text-anchor="middle" class="small">response pending</text>

    <path class="arrow" d="M800 37 H895"/>
    <rect x="910" y="0" width="230" height="74" rx="10" fill="#e6ebff" stroke="#2d2940" stroke-width="2"/>
    <text x="1025" y="30" text-anchor="middle" class="label">Master clocks packets</text>
    <text x="1025" y="55" text-anchor="middle" class="small">one 8-byte packet per CS</text>
  </g>

  <text x="80" y="500" class="subtitle">Nine-packet coherent response</text>
  <g transform="translate(80,535)">
    <rect x="0" y="0" width="135" height="86" rx="8" fill="#e9ddff" stroke="#2d2940" stroke-width="2"/>
    <text x="67" y="34" text-anchor="middle" class="label">BEGIN</text><text x="67" y="61" text-anchor="middle" class="small">seq + count</text>
    <path class="arrow" d="M142 43 H185"/>
    <rect x="195" y="0" width="570" height="86" rx="8" fill="#dff6ee" stroke="#2d2940" stroke-width="2"/>
    <text x="480" y="31" text-anchor="middle" class="label">PARAM_STATE × 6</text>
    <text x="480" y="59" text-anchor="middle" class="small">index 0=EN1, 1=EN2, 2=EN3, 3=EN4, 4=EN5, 5=EN6</text>
    <path class="arrow" d="M772 43 H815"/>
    <rect x="825" y="0" width="220" height="86" rx="8" fill="#ffe5ea" stroke="#2d2940" stroke-width="2"/>
    <text x="935" y="31" text-anchor="middle" class="label">BUTTON_STATE</text>
    <text x="935" y="59" text-anchor="middle" class="small">pressed + long bitmaps</text>
    <path class="arrow" d="M1052 43 H1095"/>
    <rect x="1105" y="0" width="135" height="86" rx="8" fill="#e9ddff" stroke="#2d2940" stroke-width="2"/>
    <text x="1172" y="34" text-anchor="middle" class="label">END</text><text x="1172" y="61" text-anchor="middle" class="small">same seq</text>
  </g>

  <g transform="translate(80,675)">
    <text x="0" y="0" class="subtitle">Button bitmap</text>
    <text x="0" y="38" class="small">bit 0 EN1   •   bit 1 EN2   •   bit 2 EN3   •   bit 3 EN4   •   bit 4 EN5   •   bit 5 EN6   •   bits 6–7 reserved</text>
    <text x="0" y="72" class="small">All multibyte payload values are little-endian. CRC-8 polynomial 0x07, initial value 0x00.</text>
  </g>
</svg>
